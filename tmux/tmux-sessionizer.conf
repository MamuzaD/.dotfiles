# ~/.config/tmux/tmux-sessionizer.conf (read by tmux-sessionizer and rexionizer)

# Directories to search for projects. A path can end in :number to set its search depth.
TS_SEARCH_PATHS=(
  ~/code/projs
  ~/personal
  ~/school/senior
)

# Specifies exact directories to include as session options.
# These paths are added directly and not recursively searched.
TS_SPECIFIC_PATHS=(
  ~/code
  ~/code/portfolio/v3
  ~/dotfiles
  ~/dotfiles/nvim
  ~/ai
)
